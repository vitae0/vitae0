  <text x="20" y="22" fill="#ffffff" fill-opacity=".38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">SIGNAL / VERIFY / REPEAT</text>
  <rect x=".5" y=".5" width="919" height="117" rx="11.5" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
</svg>