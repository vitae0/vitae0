<svg width="920" height="118" viewBox="0 0 920 118" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated research signal</title>
  <desc id="desc">A moving waveform representing iterative research and verification.</desc>
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#7dd3fc"/>
      <stop offset=".7" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity=".15"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="920" height="118" rx="12" fill="#0a0d12"/>
  <g stroke="#ffffff" stroke-opacity=".05">
    <path d="M0 29.5H920M0 59H920M0 88.5H920"/>
    <path d="M92 0V118M184 0V118M276 0V118M368 0V118M460 0V118M552 0V118M644 0V118M736 0V118M828 0V118"/>
  </g>

  <path d="M0 70
           C55 70 62 70 80 70
           C96 70 102 30 118 30
           C135 30 140 90 158 90
           C178 90 182 55 201 55
           C220 55 226 70 250 70
           C310 70 310 70 350 70
           C372 70 377 18 394 18
           C410 18 420 99 439 99
           C457 99 464 42 485 42
           C508 42 515 70 540 70
           C600 70 612 70 650 70
           C670 70 680 37 697 37
           C714 37 724 82 742 82
           C762 82 772 55 790 55
           C810 55 820 70 850 70
           C875 70 898 70 920 70"
