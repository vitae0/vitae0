    <animate attributeName="stroke-dashoffset" values="0;-68" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <path d="M0 70
           C55 70 62 70 80 70
           C96 70 102 30 118 30
           C135 30 140 90 158 90
           C178 90 182 55 201 55
           C220 55 226 70 250 70
           C310 70 310 70 350 70
           C372 70 377 18 394 18
           C410 18 420 99 439 99
           C457 99 464 42 485 42
           C508 42 515 70 540 70
           C600 70 612 70 650 70
           C670 70 680 37 697 37
           C714 37 724 82 742 82
           C762 82 772 55 790 55
           C810 55 820 70 850 70
           C875 70 898 70 920 70"
